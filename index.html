<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>Registro de Usuario</h1>
  </header>

  <!-- MAIN -->
  <main>

    <section class="registro">

      <!-- FOTO DE PERFIL -->
      <div class="perfil">

        <!-- Imagen -->
        <img 
          id="preview"
          src="https://via.placeholder.com/150"
          alt="Foto de perfil"
        >

        <!-- Seleccionar imagen -->
        <input 
          type="file"
          id="foto"
          accept="image/*"
        >

      </div>

      <!-- FORMULARIO -->
      <form id="formulario">

        <!-- Nombre -->
        <div>
          <label for="nombre">Nombre Completo:</label>

          <input 
            type="text"
            id="nombre"
            placeholder="Ingresa tu nombre"
            required
          >
        </div>

        <!-- Correo -->
        <div>
          <label for="correo">Correo Electrónico:</label>

          <input 
            type="email"
            id="correo"
            placeholder="ejemplo@correo.com"
            required
          >
        </div>

        <!-- CONTRASEÑA -->
        <div>
          <label for="password">Contraseña:</label>

          <input 
            type="password"
            id="password"
            minlength="8"
            placeholder="Mínimo 8 caracteres"
            required
          >
        </div>

        <!-- CONFIRMAR CONTRASEÑA -->
        <div>
          <label for="confirmar">Confirmar Contraseña:</label>

          <input 
            type="password"
            id="confirmar"
            placeholder="Repite la contraseña"
            required
          >

          <!-- Mensaje -->
          <small id="mensajePassword"></small>
        </div>

        <!-- FECHA -->
        <div>
          <label for="fecha">Fecha de Nacimiento:</label>

          <input 
            type="date"
            id="fecha"
            required
          >
        </div>

        <!-- COLOR FAVORITO -->
        <div>
          <label for="color">Color Favorito:</label>

          <input 
            type="color"
            id="color"
          >

          <!-- Texto del color -->
          <p id="textoColor">
            Color seleccionado: Ninguno
          </p>
        </div>

        <!-- PAÍS -->
        <div>
          <label for="pais">País:</label>

          <input 
            list="paises"
            id="pais"
            placeholder="Selecciona un país"
            required
          >

          <datalist id="paises">
            <option value="México">
            <option value="Argentina">
            <option value="Colombia">
            <option value="Chile">
            <option value="Perú">
            <option value="España">
            <option value="Canadá">
            <option value="Estados Unidos">
          </datalist>
        </div>

        <!-- BOTÓN -->
        <button type="submit">
          Registrarse
        </button>

      </form>

    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 - Página de Registro</p>
  </footer>

  <!-- JS -->
  <script src="js/app.js"></script>

</body>
</html>
